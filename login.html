<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion — Housing Investment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(rgba(4,18,43,.88),rgba(4,18,43,.94)),
        url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1600&q=85")
        center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#172033;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:800;
    margin-bottom:20px;
}

.logo span{
    color:#38bdf8;
}

.card{
    background:rgba(255,255,255,.98);
    border-radius:22px;
    padding:30px;
    box-shadow:0 25px 60px rgba(0,0,0,.30);
}

.card h1{
    text-align:center;
    color:#081c3c;
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#697586;
    font-size:13px;
    line-height:1.6;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:#27364d;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:50px;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:0 14px;
    font-size:14px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.10);
}

.password-toggle{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    font-size:18px;
}

.forgot{
    text-align:right;
    margin-top:-5px;
    margin-bottom:18px;
}

.forgot a{
    color:#0b5ed7;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
}

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#0b5ed7,#073b8f);
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(11,94,215,.25);
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:16px;
    font-size:12px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.message.error{
    background:#fff0f0;
    color:#b42318;
    border:1px solid #ffd0d0;
}

.message.success{
    background:#eaf8ef;
    color:#187a42;
    border:1px solid #c8edd5;
}

.register{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:#697586;
}

.register a{
    color:#0b5ed7;
    font-weight:800;
    text-decoration:none;
}

.security{
    text-align:center;
    margin-top:20px;
    font-size:10px;
    color:#8a95a5;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#697586;
    text-decoration:none;
    font-size:12px;
}

.back:hover{
    color:#0b5ed7;
}

@media(max-width:500px){

    body{
        padding:14px;
    }

    .card{
        padding:24px 18px;
    }

    .logo{
        font-size:23px;
    }

    .card h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🏠 Housing <span>Investment</span>
    </div>

    <div class="card">

        <h1>Bienvenue</h1>

        <p class="subtitle">
            Connectez-vous à votre espace personnel
            Housing Investment.
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="exemple@email.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Votre mot de passe"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        aria-label="Afficher le mot de passe">

                        👁️

                    </button>

                </div>

            </div>

            <div class="forgot">

                <a href="reset-password.html">
                    Mot de passe oublié ?
                </a>

            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-btn">

                Se connecter

            </button>

        </form>

        <div class="register">

            Vous n'avez pas encore de compte ?

            <a href="register.html">
                Créer un compte
            </a>

        </div>

        <div class="security">
            🔒 Connexion sécurisée par Supabase
        </div>

        <a href="index.html" class="back">
            ← Retour à l'accueil
        </a>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURATION SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://scnuphudlhqiadyavknt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_SQ6iUFoLHRsPMYE41Z8XtQ_pgaF3O5L";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ÉLÉMENTS
========================================================= */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const messageBox =
    document.getElementById("message");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type="error"){

    messageBox.textContent = text;

    messageBox.className =
        "message show " + type;

}


function hideMessage(){

    messageBox.textContent = "";

    messageBox.className =
        "message";

}


/* =========================================================
   AFFICHER / CACHER MOT DE PASSE
========================================================= */

function togglePassword(){

    const button =
        document.querySelector(".password-toggle");

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        button.textContent = "🙈";

    }else{

        passwordInput.type = "password";

        button.textContent = "👁️";

    }

}


/* =========================================================
   NORMALISATION EMAIL
========================================================= */

function normalizeEmail(email){

    return String(email || "")
        .trim()
        .toLowerCase();

}


/* =========================================================
   CONNEXION
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        hideMessage();

        const email =
            normalizeEmail(
                emailInput.value
            );

        const password =
            passwordInput.value;


        if(!email){

            showMessage(
                "Veuillez entrer votre adresse e-mail."
            );

            return;

        }


        if(!password){

            showMessage(
                "Veuillez entrer votre mot de passe."
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Connexion en cours...";


        try{

            /*
             * Nettoyage de l'ancienne session locale.
             * La vraie authentification est désormais
             * gérée par Supabase.
             */

            localStorage.removeItem(
                "currentUser"
            );


            const result =
                await supabaseClient.auth.signInWithPassword({

                    email:email,

                    password:password

                });


            if(result.error){

                throw result.error;

            }


            const user =
                result.data.user;


            if(!user){

                throw new Error(
                    "Utilisateur introuvable après connexion."
                );

            }


            /*
             * Nous conservons également certaines
             * informations locales pour assurer la
             * compatibilité avec les anciennes parties
             * du site pendant la transition.
             */

            let profile = null;


            try{

                const profileResult =
                    await supabaseClient
                    .from("profiles")
                    .select("*")
                    .eq("id",user.id)
                    .maybeSingle();


                if(
                    !profileResult.error &&
                    profileResult.data
                ){

                    profile =
                        profileResult.data;

                }

            }catch(profileError){

                console.warn(
                    "Profil non récupéré :",
                    profileError
                );

            }


            const currentUser = {

                id:user.id,

                auth_id:user.id,

                email:user.email || email,

                name:
                    profile?.name ||
                    profile?.full_name ||
                    profile?.fullname ||
                    profile?.nom ||
                    user.user_metadata?.name ||
                    user.user_metadata?.full_name ||
                    "Utilisateur",

                fullName:
                    profile?.full_name ||
                    profile?.name ||
                    user.user_metadata?.full_name ||
                    user.user_metadata?.name ||
                    "Utilisateur",

                phone:
                    profile?.phone ||
                    profile?.telephone ||
                    user.user_metadata?.phone ||
                    user.user_metadata?.telephone ||
                    "",

                balance:
                    Number(
                        profile?.balance ??
                        profile?.solde ??
                        0
                    )

            };


            localStorage.setItem(
                "currentUser",
                JSON.stringify(currentUser)
            );


            localStorage.setItem(
                "loggedIn",
                "true"
            );


            showMessage(
                "Connexion réussie. Ouverture de votre espace...",
                "success"
            );


            /*
             * Petite pause afin que le message de
             * réussite soit visible.
             */

            setTimeout(function(){

                window.location.replace(
                    "dashboard.html"
                );

            },700);


        }catch(error){

            console.error(
                "Erreur connexion Supabase :",
                error
            );


            let text =
                "Impossible de vous connecter.";


            const errorMessage =
                String(
                    error?.message || ""
                ).toLowerCase();


            if(
                errorMessage.includes(
                    "invalid login credentials"
                )
            ){

                text =
                    "E-mail ou mot de passe incorrect.";

            }else if(
                errorMessage.includes(
                    "email not confirmed"
                )
            ){

                text =
                    "Votre adresse e-mail doit encore être confirmée dans Supabase.";

            }else if(
                errorMessage.includes(
                    "too many requests"
                )
            ){

                text =
                    "Trop de tentatives. Veuillez patienter quelques instants.";

            }else if(
                error?.message
            ){

                text =
                    error.message;

            }


            showMessage(text);

            loginButton.disabled = false;

            loginButton.textContent =
                "Se connecter";

        }

    }
);


/* =========================================================
   VÉRIFICATION SESSION EXISTANTE
========================================================= */

async function checkExistingSession(){

    try{

        const result =
            await supabaseClient.auth.getSession();


        if(result.error){

            console.warn(
                "Impossible de vérifier la session :",
                result.error
            );

            return;

        }


        const session =
            result.data.session;


        if(session?.user){

            /*
             * Si l'utilisateur est déjà connecté,
             * inutile de lui demander de se reconnecter.
             */

            window.location.replace(
                "dashboard.html"
            );

        }

    }catch(error){

        console.warn(
            "Erreur vérification session :",
            error
        );

    }

}


/* =========================================================
   ÉCOUTE DES CHANGEMENTS D'AUTHENTIFICATION
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(
            event === "SIGNED_IN" &&
            session?.user
        ){

            /*
             * La redirection principale est déjà
             * effectuée après signInWithPassword().
             * Cette surveillance garantit néanmoins
             * que la session Supabase est bien active.
             */

            console.log(
                "Session Supabase active."
            );

        }

    }
);


/* =========================================================
   INITIALISATION
========================================================= */

checkExistingSession();

</script>

</body>
</html>
