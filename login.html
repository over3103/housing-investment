<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion — Housing Investment</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(rgba(5,25,55,.78),rgba(5,25,55,.88)),
        url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=85")
        center/cover fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#172033;
}

.login-container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    color:white;
    font-size:25px;
    font-weight:800;
    margin-bottom:20px;
}

.logo span{
    color:#38bdf8;
}

.login-card{
    background:rgba(255,255,255,.98);
    border-radius:22px;
    padding:32px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.login-header{
    text-align:center;
    margin-bottom:25px;
}

.login-icon{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#e9f2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.login-header h1{
    font-size:27px;
    margin-bottom:7px;
}

.login-header p{
    color:#697586;
    font-size:14px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:bold;
}

.input-wrapper{
    position:relative;
}

input{
    width:100%;
    height:50px;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:0 14px;
    font-size:15px;
    outline:none;
    transition:.2s;
    background:#fff;
}

input:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.1);
}

.phone-input{
    display:flex;
}

.phone-prefix{
    height:50px;
    padding:0 12px;
    display:flex;
    align-items:center;
    background:#eef2f7;
    border:1px solid #d8dee8;
    border-right:none;
    border-radius:10px 0 0 10px;
    font-weight:bold;
    font-size:14px;
}

.phone-input input{
    border-radius:0 10px 10px 0;
}

.password-input{
    padding-right:50px;
}

.toggle-password{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:transparent;
    cursor:pointer;
    font-size:19px;
    padding:5px;
}

.login-options{
    display:flex;
    justify-content:flex-end;
    margin-top:-5px;
    margin-bottom:20px;
}

.forgot-password{
    color:#0b5ed7;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.forgot-password:hover{
    text-decoration:underline;
}

.login-button{
    width:100%;
    height:51px;
    border:none;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-button:hover{
    background:#084da8;
    transform:translateY(-1px);
}

.message{
    display:none;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.message.error{
    display:block;
    background:#ffe9e9;
    color:#b42318;
}

.message.success{
    display:block;
    background:#e8f8ef;
    color:#18794e;
}

.register-link{
    text-align:center;
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid #edf0f4;
    font-size:14px;
    color:#697586;
}

.register-link a{
    color:#0b5ed7;
    font-weight:bold;
}

.back-home{
    display:block;
    text-align:center;
    color:white;
    margin-top:17px;
    font-size:13px;
}

.back-home:hover{
    color:#38bdf8;
}


/* MODAL MOT DE PASSE OUBLIÉ */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    position:relative;
}

.close-modal{
    position:absolute;
    right:15px;
    top:12px;
    border:none;
    background:none;
    font-size:25px;
    cursor:pointer;
    color:#697586;
}

.modal-card h2{
    margin-bottom:8px;
}

.modal-card p{
    color:#697586;
    font-size:13px;
    margin-bottom:20px;
}

.modal-button{
    width:100%;
    height:48px;
    border:none;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:480px){

    .login-card{
        padding:27px 20px;
    }

    .login-header h1{
        font-size:24px;
    }

}

</style>
</head>


<body>


<div class="login-container">

    <div class="logo">
        🏠 Housing <span>Investment</span>
    </div>


    <div class="login-card">

        <div class="login-header">

            <div class="login-icon">
                🔐
            </div>

            <h1>
                Bienvenue
            </h1>

            <p>
                Connectez-vous à votre espace personnel
            </p>

        </div>


        <div id="message"
             class="message">
        </div>


        <form id="loginForm">


            <!-- TELEPHONE -->

            <div class="form-group">

                <label for="phone">
                    Numéro de téléphone
                </label>

                <div class="phone-input">

                    <div class="phone-prefix">
                        +225
                    </div>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="07 00 00 00 00"
                        autocomplete="tel"
                        required
                    >

                </div>

            </div>


            <!-- MOT DE PASSE -->

            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Afficher le mot de passe">
                        👁️
                    </button>

                </div>

            </div>


            <!-- MOT DE PASSE OUBLIE -->

            <div class="login-options">

                <span
                    class="forgot-password"
                    id="forgotPassword">
                    Mot de passe oublié ?
                </span>

            </div>


            <button
                type="submit"
                class="login-button">
                Se connecter
            </button>


        </form>


        <div class="register-link">

            Vous n'avez pas encore de compte ?

            <a href="register.html">
                Créer un compte
            </a>

        </div>

    </div>


    <a
        href="index.html"
        class="back-home">
        ← Retour à l'accueil
    </a>

</div>



<!-- =========================
     MODAL MOT DE PASSE OUBLIÉ
========================= -->

<div
    class="modal"
    id="forgotModal">

    <div class="modal-card">

        <button
            type="button"
            class="close-modal"
            id="closeModal">
            ×
        </button>

        <h2>
            🔑 Mot de passe oublié ?
        </h2>

        <p>
            Entrez votre numéro de téléphone.
            Nous allons préparer la récupération
            de votre compte.
        </p>


        <div class="form-group">

            <label for="recoveryPhone">
                Numéro de téléphone
            </label>

            <div class="phone-input">

                <div class="phone-prefix">
                    +225
                </div>

                <input
                    type="tel"
                    id="recoveryPhone"
                    placeholder="07 00 00 00 00"
                >

            </div>

        </div>


        <div
            id="recoveryMessage"
            class="message">
        </div>


        <button
            type="button"
            class="modal-button"
            id="recoveryButton">
            Continuer
        </button>

    </div>

</div>



<script>

/* =========================
   AFFICHER / MASQUER
   MOT DE PASSE
========================= */

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

togglePassword.addEventListener("click", function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        togglePassword.textContent = "🙈";

        togglePassword.setAttribute(
            "aria-label",
            "Masquer le mot de passe"
        );

    }else{

        passwordInput.type = "password";

        togglePassword.textContent = "👁️";

        togglePassword.setAttribute(
            "aria-label",
            "Afficher le mot de passe"
        );

    }

});


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =========================
   CONNEXION
========================= */

const loginForm =
    document.getElementById("loginForm");

loginForm.addEventListener("submit",function(event){

    event.preventDefault();

    const phone =
        document.getElementById("phone")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;


    if(!phone || !password){

        showMessage(
            "Veuillez remplir tous les champs.",
            "error"
        );

        return;
    }


    /*
       Nous conservons ici la compatibilité
       avec le système de comptes déjà créé.
    */

    let users = [];

    try{

        users =
            JSON.parse(
                localStorage.getItem("users")
            ) || [];

    }catch(error){

        users = [];

    }


    const cleanPhone =
        phone.replace(/\s+/g,"");


    const user =
        users.find(function(u){

            const savedPhone =
                String(
                    u.phone ||
                    u.telephone ||
                    ""
                ).replace(/\s+/g,"");

            return (
                savedPhone === cleanPhone ||
                savedPhone === "+225" + cleanPhone ||
                savedPhone.replace("+225","") === cleanPhone
            );

        });


    if(!user){

        showMessage(
            "Aucun compte ne correspond à ce numéro.",
            "error"
        );

        return;
    }


    const savedPassword =
        user.password ||
        user.motDePasse ||
        "";


    if(savedPassword !== password){

        showMessage(
            "Mot de passe incorrect.",
            "error"
        );

        return;
    }


    /*
       Sauvegarde de l'utilisateur connecté
    */

    localStorage.setItem(
        "currentUser",
        JSON.stringify(user)
    );


    localStorage.setItem(
        "loggedIn",
        "true"
    );


    showMessage(
        "Connexion réussie. Redirection...",
        "success"
    );


    setTimeout(function(){

        window.location.href =
            "dashboard.html";

    },700);

});


/* =========================
   MOT DE PASSE OUBLIÉ
========================= */

const forgotPassword =
    document.getElementById("forgotPassword");

const forgotModal =
    document.getElementById("forgotModal");

const closeModal =
    document.getElementById("closeModal");

forgotPassword.addEventListener("click",function(){

    forgotModal.classList.add("active");

    document.getElementById(
        "recoveryPhone"
    ).focus();

});


closeModal.addEventListener("click",function(){

    forgotModal.classList.remove("active");

});


forgotModal.addEventListener("click",function(event){

    if(event.target === forgotModal){

        forgotModal.classList.remove("active");

    }

});


/* =========================
   RECUPERATION
========================= */

document
.getElementById("recoveryButton")
.addEventListener("click",function(){

    const recoveryPhone =
        document
        .getElementById("recoveryPhone")
        .value
        .trim();


    const recoveryMessage =
        document.getElementById(
            "recoveryMessage"
        );


    if(!recoveryPhone){

        recoveryMessage.textContent =
            "Veuillez entrer votre numéro.";

        recoveryMessage.className =
            "message error";

        return;
    }


    let users = [];

    try{

        users =
            JSON.parse(
                localStorage.getItem("users")
            ) || [];

    }catch(error){

        users = [];

    }


    const cleanPhone =
        recoveryPhone.replace(/\s+/g,"");


    const userExists =
        users.some(function(u){

            const savedPhone =
                String(
                    u.phone ||
                    u.telephone ||
                    ""
                ).replace(/\s+/g,"");

            return (
                savedPhone === cleanPhone ||
                savedPhone === "+225" + cleanPhone ||
                savedPhone.replace("+225","") === cleanPhone
            );

        });


    if(!userExists){

        recoveryMessage.textContent =
            "Aucun compte ne correspond à ce numéro.";

        recoveryMessage.className =
            "message error";

        return;
    }


    /*
       L'étape suivante permettra de créer
       réellement un nouveau mot de passe.
    */

    recoveryMessage.textContent =
        "Compte trouvé. La récupération sécurisée sera disponible à l'étape suivante.";

    recoveryMessage.className =
        "message success";

});


</script>

</body>
</html>
