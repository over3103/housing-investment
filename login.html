<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion — Housing Investment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(rgba(5,20,45,.88),rgba(5,20,45,.94)),
        url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1600&q=85")
        center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    color:white;
    font-size:27px;
    font-weight:800;
    margin-bottom:20px;
}

.logo span{
    color:#38bdf8;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 25px 60px rgba(0,0,0,.30);
}

h1{
    text-align:center;
    color:#081c3c;
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#697586;
    font-size:13px;
    line-height:1.6;
    margin-bottom:25px;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:16px;
    font-size:12px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.message.error{
    background:#fff0f0;
    color:#b42318;
    border:1px solid #ffd0d0;
}

.message.success{
    background:#eaf8ef;
    color:#187a42;
    border:1px solid #c8edd5;
}

.group{
    margin-bottom:16px;
}

label{
    display:block;
    color:#27364d;
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    height:50px;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:0 14px;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.10);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.password-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    font-size:18px;
}

.forgot{
    text-align:right;
    margin:-4px 0 18px;
}

.forgot a,
.register a{
    color:#0b5ed7;
    text-decoration:none;
    font-weight:bold;
}

.forgot a{
    font-size:12px;
}

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#0b5ed7,#073b8f);
    color:white;
    font-weight:800;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.register{
    text-align:center;
    color:#697586;
    font-size:13px;
    margin-top:22px;
}

.security{
    text-align:center;
    color:#8a95a5;
    font-size:10px;
    margin-top:20px;
}

.back{
    display:block;
    text-align:center;
    color:#697586;
    font-size:12px;
    text-decoration:none;
    margin-top:18px;
}

@media(max-width:500px){

    .card{
        padding:24px 18px;
    }

    .logo{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🏠 Housing <span>Investment</span>
    </div>

    <div class="card">

        <h1>Connexion</h1>

        <p class="subtitle">
            Accédez à votre espace personnel.
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="group">

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Votre adresse e-mail"
                    required
                >

            </div>

            <div class="group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Votre mot de passe"
                        required
                    >

                    <button
                        type="button"
                        class="password-btn"
                        id="passwordBtn">

                        👁️

                    </button>

                </div>

            </div>

            <div class="forgot">

                <a href="reset-password.html">
                    Mot de passe oublié ?
                </a>

            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-btn">

                Se connecter

            </button>

        </form>

        <div class="register">

            Pas encore de compte ?

            <a href="register.html">
                Créer un compte
            </a>

        </div>

        <div class="security">
            🔒 Authentification sécurisée
        </div>

        <a href="index.html" class="back">
            ← Retour à l'accueil
        </a>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://scnuphudlhqiadyavknt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_SQ6iUFoLHRsPMYE41Z8XtQ_pgaF3O5L";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ÉLÉMENTS
===================================================== */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const passwordBtn =
    document.getElementById("passwordBtn");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message show " +
        (type || "error");

}

function clearMessage(){

    message.textContent = "";

    message.className =
        "message";

}


/* =====================================================
   MOT DE PASSE
===================================================== */

passwordBtn.addEventListener(
    "click",
    function(){

        if(passwordInput.type === "password"){

            passwordInput.type = "text";

            passwordBtn.textContent = "🙈";

        }else{

            passwordInput.type = "password";

            passwordBtn.textContent = "👁️";

        }

    }
);


/* =====================================================
   CONNEXION
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();

        const email =
            emailInput.value
            .trim()
            .toLowerCase();

        const password =
            passwordInput.value;


        if(!email || !password){

            showMessage(
                "Veuillez remplir tous les champs."
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Connexion...";


        try{

            const response =
                await supabaseClient.auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(response.error){

                throw response.error;

            }


            if(!response.data || !response.data.user){

                throw new Error(
                    "La connexion n'a pas pu être établie."
                );

            }


            /*
             * La session Supabase est maintenant
             * réellement créée.
             *
             * Nous ne faisons PAS de contrôle
             * localStorage ici.
             */

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            /*
             * On conserve seulement les informations
             * minimales nécessaires à la compatibilité
             * avec les anciennes fonctions du site.
             */

            const user =
                response.data.user;


            const currentUser = {

                id:user.id,

                auth_id:user.id,

                email:user.email || email,

                name:
                    user.user_metadata?.name ||
                    user.user_metadata?.full_name ||
                    "Utilisateur",

                fullName:
                    user.user_metadata?.full_name ||
                    user.user_metadata?.name ||
                    "Utilisateur",

                phone:
                    user.user_metadata?.phone ||
                    user.user_metadata?.telephone ||
                    "",

                balance:0

            };


            localStorage.setItem(
                "currentUser",
                JSON.stringify(currentUser)
            );


            showMessage(
                "Connexion réussie. Ouverture de votre espace...",
                "success"
            );


            /*
             * IMPORTANT :
             * Une seule redirection.
             * Aucun setInterval.
             * Aucun contrôle automatique de session
             * sur cette page.
             */

            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);


        }catch(error){

            console.error(
                "Erreur Supabase :",
                error
            );


            let text =
                "Impossible de se connecter.";


            const errorText =
                String(
                    error?.message || ""
                ).toLowerCase();


            if(
                errorText.includes(
                    "invalid login credentials"
                )
            ){

                text =
                    "Adresse e-mail ou mot de passe incorrect.";

            }else if(
                errorText.includes(
                    "email not confirmed"
                )
            ){

                text =
                    "Votre adresse e-mail n'est pas encore confirmée.";

            }else if(
                error?.message
            ){

                text =
                    error.message;

            }


            showMessage(text,"error");

            loginButton.disabled = false;

            loginButton.textContent =
                "Se connecter";

        }

    }
);

</script>

</body>
</html>
