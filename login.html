<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion - Housing Investment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#061b3a,#0b5ed7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.logo{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.logo h1{
    font-size:28px;
    margin-bottom:6px;
}

.logo span{
    color:#38bdf8;
}

.logo p{
    font-size:13px;
    opacity:.85;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px 25px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.card h2{
    text-align:center;
    color:#172033;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#748094;
    font-size:13px;
    margin-bottom:25px;
}

.group{
    margin-bottom:17px;
}

label{
    display:block;
    color:#273449;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    height:48px;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:0 45px 0 13px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.10);
}

.password-box{
    position:relative;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    cursor:pointer;
    font-size:18px;
}

.options{
    display:flex;
    justify-content:flex-end;
    margin-top:-5px;
    margin-bottom:20px;
}

.forgot{
    color:#0b5ed7;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.forgot:hover{
    text-decoration:underline;
}

.btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#084db4;
}

.btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    text-align:center;
    font-size:12px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.error{
    background:#fde8e8;
    color:#c62828;
}

.success{
    background:#e7f7ee;
    color:#198754;
}

.login{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:#6d7888;
}

.login a{
    color:#0b5ed7;
    font-weight:bold;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:white;
    text-decoration:none;
    font-size:12px;
}

@media(max-width:450px){

    .card{
        padding:25px 18px;
    }

    .logo h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">

        <h1>
            🏠 Housing <span>Investment</span>
        </h1>

        <p>
            Investissez dans votre avenir
        </p>

    </div>


    <div class="card">

        <h2>Connexion</h2>

        <p class="subtitle">
            Accédez à votre espace personnel
        </p>


        <div id="message" class="message"></div>


        <form id="loginForm">

            <div class="group">

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="exemple@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword()">

                        👁️

                    </button>

                </div>

            </div>


            <div class="options">

                <a
                    href="forgot-password.html"
                    class="forgot">

                    Mot de passe oublié ?

                </a>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="btn">

                Se connecter

            </button>

        </form>


        <div class="login">

            Vous n'avez pas encore de compte ?

            <a href="register.html">
                Créer un compte
            </a>

        </div>

    </div>


    <a href="index.html" class="back">
        ← Retour à l'accueil
    </a>

</div>


<script>

const SUPABASE_URL =
    "https://scnuphudlhqiadyavknt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_SQ6iUFoLHRsPMYE41Z8XtQ_pgaF3O5L";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message show " + type;
}


function togglePassword(){

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".eye");

    if(password.type === "password"){

        password.type = "text";
        button.textContent = "🙈";

    }else{

        password.type = "password";
        button.textContent = "👁️";

    }
}


/* CONNEXION */

document
.getElementById("loginForm")
.addEventListener("submit",async function(event){

    event.preventDefault();

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("password")
        .value;

    const button =
        document.getElementById("loginButton");


    button.disabled = true;

    button.textContent =
        "Connexion...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            throw error;

        }


        /*
         * Connexion réussie.
         * Supabase conserve la session.
         */

        localStorage.setItem(
            "loggedIn",
            "true"
        );


        localStorage.setItem(
            "supabaseUser",
            JSON.stringify(data.user)
        );


        showMessage(
            "Connexion réussie. Redirection...",
            "success"
        );


        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },800);


    }catch(error){

        console.error(error);


        let message =
            "E-mail ou mot de passe incorrect.";


        if(
            error.message &&
            error.message
            .toLowerCase()
            .includes("email not confirmed")
        ){

            message =
                "Veuillez confirmer votre adresse e-mail avant de vous connecter.";

        }


        showMessage(
            message,
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Se connecter";

    }

});

</script>

</body>
</html>
