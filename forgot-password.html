<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mot de passe oublié - Housing Investment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#061b3a,#0b5ed7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.logo{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.logo h1{
    font-size:28px;
    margin-bottom:6px;
}

.logo span{
    color:#38bdf8;
}

.logo p{
    font-size:13px;
    opacity:.85;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px 25px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.card h2{
    text-align:center;
    color:#172033;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#748094;
    font-size:13px;
    line-height:1.6;
    margin-bottom:24px;
}

.group{
    margin-bottom:18px;
}

label{
    display:block;
    color:#273449;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    height:48px;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:0 13px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.10);
}

.btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:16px;
    text-align:center;
    font-size:12px;
    line-height:1.6;
}

.message.show{
    display:block;
}

.error{
    background:#fde8e8;
    color:#c62828;
}

.success{
    background:#e7f7ee;
    color:#198754;
}

.back-login{
    text-align:center;
    margin-top:20px;
    font-size:13px;
}

.back-login a{
    color:#0b5ed7;
    font-weight:bold;
    text-decoration:none;
}

.home{
    display:block;
    text-align:center;
    margin-top:18px;
    color:white;
    text-decoration:none;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">

<h1>
🏠 Housing <span>Investment</span>
</h1>

<p>
Investissez dans votre avenir
</p>

</div>


<div class="card">

<h2>
Mot de passe oublié ?
</h2>

<p class="subtitle">
Entrez l'adresse e-mail de votre compte.
Nous vous enverrons un lien sécurisé
pour créer un nouveau mot de passe.
</p>


<div id="message" class="message"></div>


<form id="forgotForm">

<div class="group">

<label for="email">
Adresse e-mail
</label>

<input
type="email"
id="email"
placeholder="exemple@email.com"
autocomplete="email"
required
>

</div>


<button
type="submit"
id="sendButton"
class="btn">

Envoyer le lien de récupération

</button>

</form>


<div class="back-login">

<a href="login.html">
← Retour à la connexion
</a>

</div>

</div>


<a href="index.html" class="home">
← Retour à l'accueil
</a>

</div>


<script>

const SUPABASE_URL =
"https://scnuphudlhqiadyavknt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SQ6iUFoLHRsPMYE41Z8XtQ_pgaF3O5L";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


function showMessage(text,type){

const message =
document.getElementById("message");

message.textContent =
text;

message.className =
"message show " + type;

}


/* =====================================
   RÉCUPÉRATION DU MOT DE PASSE
===================================== */

document
.getElementById("forgotForm")
.addEventListener("submit",async function(event){

event.preventDefault();


const email =
document
.getElementById("email")
.value
.trim()
.toLowerCase();


const button =
document.getElementById("sendButton");


if(!email){

showMessage(
"Veuillez entrer votre adresse e-mail.",
"error"
);

return;

}


button.disabled = true;

button.textContent =
"Envoi en cours...";


try{

/*
 * IMPORTANT :
 * Nous utilisons directement l'adresse
 * de la page reset-password.html.
 */

const redirectTo =
"http://localhost:5500/reset-password.html";


const result =
await supabaseClient.auth
.resetPasswordForEmail(
email,
{
redirectTo:redirectTo
}
);


if(result.error){

console.error(
"Supabase reset error:",
result.error
);

throw result.error;

}


showMessage(
"Le lien de récupération a été envoyé. Consultez votre boîte e-mail ainsi que vos courriers indésirables.",
"success"
);


document
.getElementById("forgotForm")
.reset();


button.disabled = false;

button.textContent =
"Envoyer le lien de récupération";


}catch(error){

console.error(
"Erreur complète:",
error
);


let errorMessage =
"Impossible d'envoyer le lien pour le moment.";


/*
 * Messages plus précis selon Supabase.
 */

if(error.message){

const msg =
error.message.toLowerCase();


if(
msg.includes("redirect") ||
msg.includes("url")
){

errorMessage =
"L'adresse de récupération n'est pas encore autorisée dans Supabase.";

}

else if(
msg.includes("rate")
){

errorMessage =
"Trop de demandes. Veuillez patienter quelques minutes avant de réessayer.";

}

else if(
msg.includes("email")
){

errorMessage =
"Vérifiez que l'adresse e-mail est correctement saisie.";

}

}


showMessage(
errorMessage,
"error"
);


button.disabled = false;

button.textContent =
"Envoyer le lien de récupération";

}

});

</script>

</body>
</html>
