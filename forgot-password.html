<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Réinitialiser le mot de passe — Housing Investment</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(rgba(5,25,55,.80),rgba(5,25,55,.90)),
        url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=85")
        center/cover fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    color:white;
    font-size:24px;
    font-weight:800;
    margin-bottom:20px;
}

.logo span{
    color:#38bdf8;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.icon{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#e9f2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:30px;
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}

.description{
    text-align:center;
    color:#697586;
    font-size:13px;
    margin-bottom:25px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group{
    margin-bottom:17px;
}

.phone{
    display:flex;
}

.prefix{
    height:50px;
    padding:0 12px;
    display:flex;
    align-items:center;
    background:#eef2f7;
    border:1px solid #d8dee8;
    border-right:none;
    border-radius:10px 0 0 10px;
    font-weight:bold;
}

input{
    width:100%;
    height:50px;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:0 14px;
    font-size:15px;
    outline:none;
}

.phone input{
    border-radius:0 10px 10px 0;
}

input:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.1);
}

.password-wrapper{
    position:relative;
}

.password-wrapper input{
    padding-right:48px;
}

.eye{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    font-size:18px;
}

button.main{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button.main:hover{
    background:#084da8;
}

.message{
    display:none;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.message.error{
    display:block;
    background:#ffe9e9;
    color:#b42318;
}

.message.success{
    display:block;
    background:#e8f8ef;
    color:#18794e;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:white;
    font-size:13px;
}

.back:hover{
    color:#38bdf8;
}

@media(max-width:480px){
    .card{
        padding:26px 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🏠 Housing <span>Investment</span>
    </div>

    <div class="card">

        <div class="icon">
            🔑
        </div>

        <h1>
            Nouveau mot de passe
        </h1>

        <p class="description">
            Entrez votre numéro de téléphone puis choisissez
            votre nouveau mot de passe.
        </p>

        <div id="message" class="message"></div>

        <form id="resetForm">

            <div class="form-group">

                <label>
                    Numéro de téléphone
                </label>

                <div class="phone">

                    <div class="prefix">
                        +225
                    </div>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="07 00 00 00 00"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Nouveau mot de passe
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Nouveau mot de passe"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        id="eye1">
                        👁️
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Confirmer le mot de passe
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirmer le mot de passe"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        id="eye2">
                        👁️
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="main">
                Réinitialiser mon mot de passe
            </button>

        </form>

    </div>

    <a href="login.html" class="back">
        ← Retour à la connexion
    </a>

</div>


<script>

const form =
    document.getElementById("resetForm");

const message =
    document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* AFFICHER MOT DE PASSE */

document
.getElementById("eye1")
.addEventListener("click",function(){

    const input =
        document.getElementById("newPassword");

    if(input.type === "password"){
        input.type = "text";
        this.textContent = "🙈";
    }else{
        input.type = "password";
        this.textContent = "👁️";
    }

});


document
.getElementById("eye2")
.addEventListener("click",function(){

    const input =
        document.getElementById("confirmPassword");

    if(input.type === "password"){
        input.type = "text";
        this.textContent = "🙈";
    }else{
        input.type = "password";
        this.textContent = "👁️";
    }

});


/* RESET */

form.addEventListener("submit",function(event){

    event.preventDefault();

    const phone =
        document
        .getElementById("phone")
        .value
        .trim()
        .replace(/\s+/g,"");

    const newPassword =
        document
        .getElementById("newPassword")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    if(newPassword.length < 6){

        showMessage(
            "Le mot de passe doit contenir au moins 6 caractères.",
            "error"
        );

        return;
    }


    if(newPassword !== confirmPassword){

        showMessage(
            "Les deux mots de passe ne correspondent pas.",
            "error"
        );

        return;
    }


    let users = [];

    try{

        users =
            JSON.parse(
                localStorage.getItem("users")
            ) || [];

    }catch(error){

        users = [];

    }


    const index =
        users.findIndex(function(user){

            const savedPhone =
                String(
                    user.phone ||
                    user.telephone ||
                    ""
                )
                .replace(/\s+/g,"");

            return (
                savedPhone === phone ||
                savedPhone === "+225" + phone ||
                savedPhone.replace("+225","") === phone
            );

        });


    if(index === -1){

        showMessage(
            "Aucun compte ne correspond à ce numéro.",
            "error"
        );

        return;
    }


    /*
       Mise à jour du mot de passe
    */

    users[index].password =
        newPassword;


    /*
       Compatibilité avec certaines anciennes
       structures de comptes
    */

    if(users[index].motDePasse !== undefined){

        users[index].motDePasse =
            newPassword;

    }


    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    showMessage(
        "Mot de passe modifié avec succès !",
        "success"
    );


    setTimeout(function(){

        window.location.href =
            "login.html";

    },1200);

});

</script>

</body>
</html>
