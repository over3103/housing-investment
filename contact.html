<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assistance — Housing Investment</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(rgba(5,25,55,.80),rgba(5,25,55,.90)),
        url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=85")
        center/cover fixed;
    color:#172033;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.logo{
    text-align:center;
    color:white;
    font-size:25px;
    font-weight:800;
    margin:10px 0 22px;
}

.logo span{
    color:#38bdf8;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.icon{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#e9f2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:30px;
}

.header h1{
    font-size:30px;
    margin-bottom:8px;
}

.header p{
    color:#697586;
    font-size:14px;
}

.contact-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:30px;
}

.contact-box{
    background:#f7f9fc;
    border:1px solid #e5eaf0;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.contact-icon{
    font-size:28px;
    margin-bottom:10px;
}

.contact-box h3{
    font-size:15px;
    margin-bottom:6px;
}

.contact-box p{
    color:#697586;
    font-size:12px;
}

.form-title{
    font-size:21px;
    margin-bottom:18px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:13px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    outline:none;
    background:white;
}

input,
select{
    height:48px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.1);
}

.submit{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.submit:hover{
    background:#084da8;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:17px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.message.success{
    display:block;
    background:#e8f8ef;
    color:#18794e;
}

.message.error{
    display:block;
    background:#ffe9e9;
    color:#b42318;
}

.back{
    display:block;
    text-align:center;
    color:white;
    margin-top:18px;
    font-size:13px;
}

.back:hover{
    color:#38bdf8;
}

@media(max-width:700px){

    .contact-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:22px 18px;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🏠 Housing <span>Investment</span>
    </div>


    <div class="card">

        <div class="header">

            <div class="icon">
                🎧
            </div>

            <h1>
                Centre d'assistance
            </h1>

            <p>
                Notre équipe est disponible pour vous accompagner
                dans l'utilisation de votre espace.
            </p>

        </div>


        <!-- CONTACTS -->

        <div class="contact-grid">

            <div class="contact-box">

                <div class="contact-icon">
                    📞
                </div>

                <h3>
                    Téléphone
                </h3>

                <p>
                    Service client
                </p>

            </div>


            <div class="contact-box">

                <div class="contact-icon">
                    💬
                </div>

                <h3>
                    WhatsApp
                </h3>

                <p>
                    Assistance rapide
                </p>

            </div>


            <div class="contact-box">

                <div class="contact-icon">
                    ✉️
                </div>

                <h3>
                    E-mail
                </h3>

                <p>
                    Support Housing Investment
                </p>

            </div>

        </div>


        <h2 class="form-title">
            📝 Envoyer une demande
        </h2>


        <div
            id="message"
            class="message">
        </div>


        <form id="contactForm">


            <div class="form-group">

                <label for="name">
                    Nom complet
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Votre nom complet"
                    required>

            </div>


            <div class="form-group">

                <label for="phone">
                    Numéro de téléphone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="+225 07 00 00 00 00"
                    required>

            </div>


            <div class="form-group">

                <label for="subject">
                    Motif de votre demande
                </label>

                <select
                    id="subject"
                    required>

                    <option value="">
                        Sélectionnez un motif
                    </option>

                    <option>
                        Problème de compte
                    </option>

                    <option>
                        Dépôt
                    </option>

                    <option>
                        Retrait
                    </option>

                    <option>
                        Investissement
                    </option>

                    <option>
                        Mot de passe
                    </option>

                    <option>
                        Autre
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="messageText">
                    Votre message
                </label>

                <textarea
                    id="messageText"
                    placeholder="Décrivez votre problème ou votre demande..."
                    required></textarea>

            </div>


            <button
                type="submit"
                class="submit">

                📩 Envoyer ma demande

            </button>

        </form>

    </div>


    <a
        href="index.html"
        class="back">

        ← Retour à l'accueil

    </a>

</div>


<script>

const form =
    document.getElementById("contactForm");

const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const name =
            document
            .getElementById("name")
            .value
            .trim();

        const phone =
            document
            .getElementById("phone")
            .value
            .trim();

        const subject =
            document
            .getElementById("subject")
            .value;

        const messageText =
            document
            .getElementById("messageText")
            .value
            .trim();


        if(
            !name ||
            !phone ||
            !subject ||
            !messageText
        ){

            message.textContent =
                "Veuillez remplir tous les champs.";

            message.className =
                "message error";

            return;
        }


        /*
        Enregistrement local de la demande.
        Cela permet à l'administrateur de retrouver
        les demandes lorsque nous ajouterons
        la section Assistance dans admin.html.
        */

        let requests = [];

        try{

            requests =
                JSON.parse(
                    localStorage.getItem(
                        "supportRequests"
                    )
                ) || [];

        }catch(error){

            requests = [];

        }


        const request = {

            id:
                Date.now(),

            name:
                name,

            phone:
                phone,

            subject:
                subject,

            message:
                messageText,

            date:
                new Date().toLocaleString(
                    "fr-FR"
                ),

            status:
                "Nouveau"

        };


        requests.push(request);


        localStorage.setItem(
            "supportRequests",
            JSON.stringify(requests)
        );


        message.textContent =
            "Votre demande a bien été enregistrée. Merci de contacter Housing Investment.";

        message.className =
            "message success";


        form.reset();

    }
);

</script>

</body>
</html>
