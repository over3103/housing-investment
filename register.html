register.html

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - Housing Investment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        Housing Investment
    </div>

    <nav class="navigation">
        <a href="index.html">Accueil</a>
        <a href="login.html" class="btn btn-primary">
            Se connecter
        </a>
    </nav>

</header>


<main>

<section style="
    padding:80px 20px;
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
">

    <div style="
        width:100%;
        max-width:500px;
        background:#fff;
        padding:40px;
        border-radius:15px;
        box-shadow:0 10px 35px rgba(20,40,70,.08);
    ">

        <div style="
            text-align:center;
            margin-bottom:30px;
        ">

            <span class="section-label">
                ESPACE MEMBRE
            </span>

            <h1 style="margin-bottom:10px;">
                Créer un compte
            </h1>

            <p style="color:#667085;">
                Créez votre compte Housing Investment.
            </p>

        </div>


        <form id="registerForm">


            <!-- NOM COMPLET -->

            <div style="margin-bottom:20px;">

                <label
                    for="fullName"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:700;
                    "
                >
                    Nom complet
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Votre nom complet"
                    required
                    style="
                        width:100%;
                        padding:14px;
                        border:1px solid #d0d5dd;
                        border-radius:8px;
                        font-size:16px;
                        box-sizing:border-box;
                    "
                >

            </div>


            <!-- TELEPHONE -->

            <div style="margin-bottom:20px;">

                <label
                    for="phone"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:700;
                    "
                >
                    Numéro de téléphone
                </label>

                <div style="
                    display:flex;
                    gap:8px;
                ">

                    <div style="
                        padding:14px 12px;
                        background:#f2f4f7;
                        border:1px solid #d0d5dd;
                        border-radius:8px;
                        font-weight:700;
                    ">
                        +225
                    </div>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="0700000000"
                        maxlength="10"
                        required
                        style="
                            flex:1;
                            width:100%;
                            padding:14px;
                            border:1px solid #d0d5dd;
                            border-radius:8px;
                            font-size:16px;
                            box-sizing:border-box;
                        "
                    >

                </div>

            </div>


            <!-- MOT DE PASSE -->

            <div style="margin-bottom:20px;">

                <label
                    for="password"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:700;
                    "
                >
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Votre mot de passe"
                    required
                    style="
                        width:100%;
                        padding:14px;
                        border:1px solid #d0d5dd;
                        border-radius:8px;
                        font-size:16px;
                        box-sizing:border-box;
                    "
                >

            </div>


            <!-- CONFIRMATION -->

            <div style="margin-bottom:20px;">

                <label
                    for="confirmPassword"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:700;
                    "
                >
                    Confirmer le mot de passe
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirmez votre mot de passe"
                    required
                    style="
                        width:100%;
                        padding:14px;
                        border:1px solid #d0d5dd;
                        border-radius:8px;
                        font-size:16px;
                        box-sizing:border-box;
                    "
                >

            </div>


            <!-- CODE INVITATION -->

            <div style="margin-bottom:20px;">

                <label
                    for="invitationCode"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:700;
                    "
                >
                    Code d'invitation
                    <span style="
                        font-weight:400;
                        color:#667085;
                    ">
                        (facultatif)
                    </span>
                </label>

                <input
                    type="text"
                    id="invitationCode"
                    placeholder="Code d'invitation"
                    style="
                        width:100%;
                        padding:14px;
                        border:1px solid #d0d5dd;
                        border-radius:8px;
                        font-size:16px;
                        box-sizing:border-box;
                    "
                >

            </div>


            <!-- MESSAGE -->

            <div
                id="registerMessage"
                style="
                    margin-bottom:20px;
                    text-align:center;
                    font-weight:600;
                "
            ></div>


            <!-- BOUTON -->

            <button
                type="submit"
                class="btn btn-primary"
                style="
                    width:100%;
                    border:none;
                    font-size:16px;
                "
            >
                Créer mon compte
            </button>

        </form>


        <p style="
            text-align:center;
            margin-top:25px;
            color:#667085;
        ">

            Vous avez déjà un compte ?

            <a
                href="login.html"
                style="
                    color:#123c69;
                    font-weight:700;
                "
            >
                Se connecter
            </a>

        </p>

    </div>

</section>

</main>


<footer class="footer">

    <div class="footer-bottom">

        <p>
            © 2026 Housing Investment.
            Tous droits réservés.
        </p>
    </div>

</footer>


<script>

document
.getElementById("registerForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const fullName =
        document.getElementById("fullName")
        .value
        .trim();

    const phoneInput =
        document.getElementById("phone")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;

    const invitationCode =
        document.getElementById("invitationCode")
        .value
        .trim();

    const message =
        document.getElementById("registerMessage");


    /* =========================
       NETTOYAGE DU NUMÉRO
    ========================= */

    const phoneDigits =
        phoneInput.replace(/\D/g, "");


    if (
        phoneDigits.length !== 10 ||
        !phoneDigits.startsWith("0")
    ) {

        message.textContent =
            "Veuillez entrer un numéro ivoirien valide à 10 chiffres.";

        message.style.color =
            "#b42318";

        return;
    }


    /* =========================
       VERIFICATION MOT DE PASSE
    ========================= */

    if (password.length < 4) {

        message.textContent =
            "Le mot de passe doit contenir au moins 4 caractères.";

        message.style.color =
            "#b42318";

        return;
    }


    if (password !== confirmPassword) {

        message.textContent =
            "Les mots de passe ne correspondent pas.";

        message.style.color =
            "#b42318";

        return;
    }


    /* =========================
       NUMÉRO COMPLET
    ========================= */

    const fullPhone =
        "+225" + phoneDigits;


    /* =========================
       RECUPERATION DES UTILISATEURS
    ========================= */

    let users = [];

    const savedUsers =
        localStorage.getItem("housingUsers");


    if (savedUsers) {

        try {

            users =
                JSON.parse(savedUsers);

            if (!Array.isArray(users)) {
                users = [];
            }

        } catch (error) {

            users = [];

        }
    }


    /*
       COMPATIBILITE AVEC L'ANCIEN
       SYSTEME A UN SEUL UTILISATEUR
    */

    const oldUser =
        localStorage.getItem("housingUser");


    if (
        oldUser &&
        users.length === 0
    ) {

        try {

            const previousUser =
                JSON.parse(oldUser);

            if (previousUser) {
                users.push(previousUser);
            }

        } catch (error) {

            console.log(
                "Ancien compte non récupéré."
            );

        }
    }


    /* =========================
       VERIFICATION DOUBLON
    ========================= */

    const alreadyExists =
        users.some(function(user) {

            let existingPhone =
                String(user.phone || "")
                .replace(/\D/g, "");

            if (
                existingPhone.startsWith("225") &&
                existingPhone.length === 13
            ) {

                existingPhone =
                    existingPhone.substring(3);

            }

            return existingPhone === phoneDigits;

        });


    if (alreadyExists) {

        message.textContent =
            "Un compte existe déjà avec ce numéro.";

        message.style.color =
            "#b42318";

        return;
    }


    /* =========================
       CREATION DU COMPTE
    ========================= */

    const newUser = {

        id:
            Date.now().toString(),

        fullName:
            fullName,

        phone:
            fullPhone,

        password:
            password,

        invitationCode:
            invitationCode,

        balance:
            0,

        investment:
            0,

        createdAt:
            new Date().toISOString()

    };


    /* =========================
       AJOUT DU NOUVEL UTILISATEUR
    ========================= */

    users.push(newUser);


    localStorage.setItem(
        "housingUsers",
        JSON.stringify(users)
    );


    /*
       On conserve également le dernier
       compte dans housingUser pour
       assurer la compatibilité avec
       les anciennes parties du site.
    */

    localStorage.setItem(
        "housingUser",
        JSON.stringify(newUser)
    );


    /* =========================
       SUCCÈS
    ========================= */

    message.textContent =
        "Compte créé avec succès !";

    message.style.color =
        "#027a48";


    setTimeout(function() {

        window.location.href =
            "login.html";

    }, 1000);

});

</script>

</body>
</html>
