<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un compte - Housing Investment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#061b3a,#0b5ed7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:440px;
}

.logo{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.logo h1{
    font-size:28px;
    margin-bottom:6px;
}

.logo span{
    color:#38bdf8;
}

.logo p{
    font-size:13px;
    opacity:.85;
}

.card{
    background:white;
    border-radius:20px;
    padding:28px 25px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.card h2{
    text-align:center;
    color:#172033;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#748094;
    font-size:13px;
    margin-bottom:23px;
}

.group{
    margin-bottom:15px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#273449;
    margin-bottom:7px;
}

input{
    width:100%;
    height:47px;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:0 13px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.10);
}

.phone-box{
    position:relative;
}

.prefix{
    position:absolute;
    left:1px;
    top:1px;
    width:58px;
    height:45px;
    background:#f0f4f9;
    border-radius:9px 0 0 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
    color:#26364c;
}

.phone{
    padding-left:70px;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:45px;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    cursor:pointer;
    font-size:18px;
}

.help{
    color:#748094;
    font-size:11px;
    margin-top:5px;
}

.invitation{
    color:#748094;
    font-size:11px;
    font-weight:normal;
}

.message{
    display:none;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    text-align:center;
    font-size:12px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.error{
    background:#fde8e8;
    color:#c62828;
}

.success{
    background:#e7f7ee;
    color:#198754;
}

.warning{
    background:#fff4dc;
    color:#9a6500;
}

.btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#084db4;
}

.btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.login{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#6d7888;
}

.login a{
    color:#0b5ed7;
    font-weight:bold;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:white;
    text-decoration:none;
    font-size:12px;
}

@media(max-width:450px){

    .card{
        padding:25px 18px;
    }

    .logo h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">

        <h1>
            🏠 Housing <span>Investment</span>
        </h1>

        <p>
            Investissez dans votre avenir
        </p>

    </div>


    <div class="card">

        <h2>
            Créer un compte
        </h2>

        <p class="subtitle">
            Rejoignez Housing Investment
        </p>


        <div
            id="message"
            class="message">
        </div>


        <form id="registerForm">

            <!-- NOM -->

            <div class="group">

                <label for="fullName">
                    Nom complet
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Votre nom complet"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- TELEPHONE -->

            <div class="group">

                <label for="phone">
                    Numéro de téléphone
                </label>

                <div class="phone-box">

                    <span class="prefix">
                        +225
                    </span>

                    <input
                        type="tel"
                        id="phone"
                        class="phone"
                        placeholder="07 00 00 00 00"
                        maxlength="10"
                        autocomplete="tel"
                        required
                    >

                </div>

                <div class="help">
                    Entrez les 10 chiffres de votre numéro.
                </div>

            </div>


            <!-- EMAIL -->

            <div class="group">

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="exemple@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 caractères"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('password',this)">

                        👁️

                    </button>

                </div>

                <div class="help">
                    Utilisez au moins 8 caractères.
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="group">

                <label for="confirmPassword">
                    Confirmer le mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Répétez votre mot de passe"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('confirmPassword',this)">

                        👁️

                    </button>

                </div>

            </div>


            <!-- INVITATION -->

            <div class="group">

                <label for="invitationCode">

                    Code d'invitation
                    <span class="invitation">
                        (facultatif)
                    </span>

                </label>

                <input
                    type="text"
                    id="invitationCode"
                    placeholder="Code d'invitation"
                    autocomplete="off"
                >

            </div>


            <button
                type="submit"
                id="registerButton"
                class="btn">

                Créer mon compte

            </button>

        </form>


        <div class="login">

            Vous avez déjà un compte ?

            <a href="login.html">
                Se connecter
            </a>

        </div>

    </div>


    <a
        href="index.html"
        class="back">

        ← Retour à l'accueil

    </a>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://scnuphudlhqiadyavknt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_SQ6iUFoLHRsPMYE41Z8XtQ_pgaF3O5L";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   AFFICHER MESSAGE
===================================================== */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.className =
        "message show " + type;

}


/* =====================================================
   MOT DE PASSE
===================================================== */

function togglePassword(id,button){

    const input =
        document.getElementById(id);


    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁️";

    }

}


/* =====================================================
   TELEPHONE
===================================================== */

document
.getElementById("phone")
.addEventListener("input",function(){

    this.value =
        this.value
        .replace(/\D/g,"")
        .slice(0,10);

});


/* =====================================================
   INSCRIPTION
===================================================== */

document
.getElementById("registerForm")
.addEventListener("submit",async function(event){

    event.preventDefault();


    const button =
        document.getElementById(
            "registerButton"
        );


    const fullName =
        document
        .getElementById("fullName")
        .value.trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .replace(/\D/g,"");


    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("password")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const invitationCode =
        document
        .getElementById("invitationCode")
        .value.trim();


    /* ================= VALIDATIONS ================= */

    if(fullName.length < 2){

        showMessage(
            "Veuillez entrer votre nom complet.",
            "error"
        );

        return;

    }


    if(phone.length !== 10){

        showMessage(
            "Le numéro ivoirien doit contenir 10 chiffres.",
            "error"
        );

        return;

    }


    if(!email){

        showMessage(
            "Veuillez entrer une adresse e-mail valide.",
            "error"
        );

        return;

    }


    if(password.length < 8){

        showMessage(
            "Le mot de passe doit contenir au moins 8 caractères.",
            "error"
        );

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            "Les deux mots de passe ne correspondent pas.",
            "error"
        );

        return;

    }


    /* ================= CHARGEMENT ================= */

    button.disabled = true;

    button.textContent =
        "Création du compte...";


    try{

        /*
         * Supabase crée le compte sécurisé.
         * Le trigger créé précédemment
         * créera automatiquement le profil.
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:fullName,

                    phone:"+225" + phone,

                    invitation_code:
                        invitationCode || null

                }

            }

        });


        if(error){

            throw error;

        }


        /*
         * Avec la confirmation e-mail activée,
         * Supabase demande à l'utilisateur
         * de confirmer son adresse.
         */

        if(
            data.user &&
            !data.session
        ){

            showMessage(
                "Compte créé avec succès ! Vérifiez votre e-mail pour confirmer votre adresse avant de vous connecter.",
                "success"
            );


            document
            .getElementById("registerForm")
            .reset();


            button.disabled = false;

            button.textContent =
                "Créer mon compte";


            return;

        }


        /*
         * Si la confirmation e-mail n'est pas
         * nécessaire, l'utilisateur peut être
         * connecté immédiatement.
         */

        if(data.session){

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            localStorage.setItem(
                "supabaseUser",
                JSON.stringify(
                    data.user
                )
            );


            showMessage(
                "Compte créé avec succès. Redirection...",
                "success"
            );


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },1000);

        }

    }catch(error){

        console.error(
            "Erreur inscription :",
            error
        );


        let message =
            "Impossible de créer le compte.";


        if(
            error.message &&
            error.message.toLowerCase()
            .includes("already registered")
        ){

            message =
                "Cette adresse e-mail est déjà utilisée.";

        }


        if(
            error.message &&
            error.message.toLowerCase()
            .includes("password")
        ){

            message =
                "Le mot de passe n'est pas suffisamment sécurisé.";

        }


        if(
            error.message &&
            error.message.toLowerCase()
            .includes("email")
        ){

            message =
                "Veuillez vérifier votre adresse e-mail.";

        }


        showMessage(
            message,
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Créer mon compte";

    }

});

</script>

</body>
</html>
