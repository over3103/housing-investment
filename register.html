<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - Housing Investment</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #087f45, #0aa65b);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            color: white;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,.20);
        }

        h1 {
            text-align: center;
            color: #087f45;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7ddd9;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #087f45;
        }

        .phone-box {
            display: flex;
            gap: 7px;
        }

        .prefix {
            width: 75px;
            background: #f2f5f3;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            font-weight: bold;
            color: #087f45;
        }

        .phone-box input {
            flex: 1;
        }

        .optional {
            color: #888;
            font-weight: normal;
            font-size: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #087f45;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:hover {
            background: #066b3a;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .error {
            background: #fdecec;
            color: #b42318;
        }

        .success {
            background: #e9f8ef;
            color: #087f45;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #087f45;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        🏠 Housing Investment
    </div>

    <div class="card">

        <h1>Créer un compte</h1>

        <p class="subtitle">
            Rejoignez Housing Investment
        </p>

        <div
            id="message"
            class="message">
        </div>

        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Nom complet
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Ex : TEKI Olivier"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Numéro de téléphone
                </label>

                <div class="phone-box">

                    <div class="prefix">
                        +225
                    </div>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="0700000000"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Créer un mot de passe"
                    minlength="4"
                    required
                >

            </div>


            <div class="form-group">

                <label for="invitation">
                    Code d'invitation
                    <span class="optional">
                        (facultatif)
                    </span>
                </label>

                <input
                    type="text"
                    id="invitation"
                    placeholder="Code d'invitation"
                >

            </div>


            <button
                type="submit"
                class="btn">
                Créer mon compte
            </button>

        </form>


        <div class="login-link">

            Vous avez déjà un compte ?

            <a href="login.html">
                Se connecter
            </a>

        </div>

    </div>

</div>


<script src="script.js"></script>

<script>

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        let phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const invitation =
            document.getElementById(
                "invitation"
            ).value.trim();


        /* Nettoyage du numéro */

        phone =
            phone.replace(/\D/g, "");


        if (phone.length !== 10) {

            showMessage(
                "Veuillez entrer un numéro ivoirien valide à 10 chiffres.",
                "error"
            );

            return;

        }


        const fullPhone =
            "+225" + phone;


        const result =
            window.HousingInvestment.registerUser({

                name: name,

                phone: fullPhone,

                password: password,

                invitationCode: invitation

            });


        if (!result.success) {

            showMessage(
                result.message,
                "error"
            );

            return;

        }


        showMessage(
            "Compte créé avec succès ! Redirection...",
            "success"
        );


        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            1200
        );

    }
);

</script>

</body>
</html>
