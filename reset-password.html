<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nouveau mot de passe - Housing Investment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#061b3a,#0b5ed7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.logo{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.logo h1{
    font-size:28px;
    margin-bottom:6px;
}

.logo span{
    color:#38bdf8;
}

.logo p{
    font-size:13px;
    opacity:.85;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px 25px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.card h2{
    text-align:center;
    color:#172033;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#748094;
    font-size:13px;
    line-height:1.6;
    margin-bottom:24px;
}

.group{
    margin-bottom:18px;
}

label{
    display:block;
    color:#273449;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.password-box{
    position:relative;
}

input{
    width:100%;
    height:48px;
    border:1px solid #d8dee8;
    border-radius:10px;
    padding:0 45px 0 13px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.10);
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    cursor:pointer;
    font-size:18px;
}

.help{
    color:#748094;
    font-size:11px;
    margin-top:6px;
}

.btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#084db4;
}

.btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:16px;
    text-align:center;
    font-size:12px;
    line-height:1.6;
}

.message.show{
    display:block;
}

.error{
    background:#fde8e8;
    color:#c62828;
}

.success{
    background:#e7f7ee;
    color:#198754;
}

.login{
    text-align:center;
    margin-top:20px;
    font-size:13px;
}

.login a{
    color:#0b5ed7;
    font-weight:bold;
    text-decoration:none;
}

.home{
    display:block;
    text-align:center;
    margin-top:18px;
    color:white;
    text-decoration:none;
    font-size:12px;
}

@media(max-width:450px){

    .card{
        padding:25px 18px;
    }

    .logo h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">

        <h1>
            🏠 Housing <span>Investment</span>
        </h1>

        <p>
            Investissez dans votre avenir
        </p>

    </div>


    <div class="card">

        <h2>
            Nouveau mot de passe
        </h2>

        <p class="subtitle">
            Choisissez un nouveau mot de passe
            sécurisé pour protéger votre compte.
        </p>


        <div
            id="message"
            class="message">
        </div>


        <form id="resetForm">

            <div class="group">

                <label for="password">
                    Nouveau mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 caractères"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('password',this)">

                        👁️

                    </button>

                </div>

                <div class="help">
                    Utilisez au moins 8 caractères.
                </div>

            </div>


            <div class="group">

                <label for="confirmPassword">
                    Confirmer le nouveau mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Répétez le mot de passe"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('confirmPassword',this)">

                        👁️

                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="resetButton"
                class="btn">

                Modifier mon mot de passe

            </button>

        </form>


        <div class="login">

            Vous connaissez votre mot de passe ?

            <a href="login.html">
                Se connecter
            </a>

        </div>

    </div>


    <a
        href="index.html"
        class="home">

        ← Retour à l'accueil

    </a>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://scnuphudlhqiadyavknt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_SQ6iUFoLHRsPMYE41Z8XtQ_pgaF3O5L";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.className =
        "message show " + type;
}


/* =========================================
   AFFICHER / MASQUER MOT DE PASSE
========================================= */

function togglePassword(id,button){

    const input =
        document.getElementById(id);


    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁️";

    }
}


/* =========================================
   SURVEILLER LA SESSION DE RÉCUPÉRATION
========================================= */

let recoveryReady = false;


supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(event === "PASSWORD_RECOVERY"){

            recoveryReady = true;

        }

    }
);


/* =========================================
   RÉINITIALISATION
========================================= */

document
.getElementById("resetForm")
.addEventListener("submit",async function(event){

    event.preventDefault();


    const password =
        document
        .getElementById("password")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const button =
        document.getElementById("resetButton");


    if(password.length < 8){

        showMessage(
            "Le mot de passe doit contenir au moins 8 caractères.",
            "error"
        );

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            "Les deux mots de passe ne correspondent pas.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Modification en cours...";


    try{

        const {
            error
        } =
        await supabaseClient.auth.updateUser({

            password:password

        });


        if(error){

            throw error;

        }


        /*
         * Le nouveau mot de passe est maintenant
         * enregistré par Supabase.
         */

        showMessage(
            "Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter.",
            "success"
        );


        document
        .getElementById("resetForm")
        .reset();


        /*
         * Déconnexion de la session de récupération
         * après modification.
         */

        setTimeout(async function(){

            await supabaseClient.auth.signOut();

            window.location.href =
                "login.html";

        },1800);


    }catch(error){

        console.error(
            "Erreur réinitialisation :",
            error
        );


        showMessage(
            "Le lien de récupération est invalide, expiré ou déjà utilisé. Demandez un nouveau lien.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Modifier mon mot de passe";

    }

});

</script>

</body>
</html>
