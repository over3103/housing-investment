<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Housing Investment - Administration</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #0b5d3b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 94%;
            max-width: 1100px;
            margin: 20px auto;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .menu button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .menu button.active {
            background: #0b5d3b;
            color: white;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,.07);
        }

        .section h2 {
            color: #0b5d3b;
            margin-top: 0;
        }

        .operation {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .operation-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .amount {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .approved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .rejected {
            background: #f8d7da;
            color: #842029;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .buttons button {
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .approve {
            background: #0b5d3b;
            color: white;
        }

        .reject {
            background: #b42318;
            color: white;
        }

        .delete {
            background: #555;
            color: white;
        }

        .user {
            border-bottom: 1px solid #eee;
            padding: 14px 0;
        }

        .user:last-child {
            border-bottom: none;
        }

        .empty {
            padding: 20px;
            text-align: center;
            color: #777;
        }

        .logout {
            background: #222;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Housing Investment</h1>
    <p>Espace Administrateur</p>
</header>


<div class="container">

    <!-- MENU -->

    <div class="menu">

        <button
            class="active"
            onclick="showSection('users', this)">
            Utilisateurs
        </button>

        <button
            onclick="showSection('deposits', this)">
            Dépôts
        </button>

        <button
            onclick="showSection('withdrawals', this)">
            Retraits
        </button>

        <button
            onclick="showSection('history', this)">
            Historique
        </button>

    </div>


    <!-- UTILISATEURS -->

    <div
        id="users"
        class="section">

        <h2>👥 Utilisateurs enregistrés</h2>

        <div id="usersList"></div>

    </div>


    <!-- DEPOTS -->

    <div
        id="deposits"
        class="section"
        style="display:none;">

        <h2>💰 Demandes de dépôt</h2>

        <div id="depositsList"></div>

    </div>


    <!-- RETRAITS -->

    <div
        id="withdrawals"
        class="section"
        style="display:none;">

        <h2>💸 Demandes de retrait</h2>

        <div id="withdrawalsList"></div>

    </div>


    <!-- HISTORIQUE -->

    <div
        id="history"
        class="section"
        style="display:none;">

        <h2>📋 Historique des opérations</h2>

        <div id="historyList"></div>

    </div>


    <button
        class="logout"
        onclick="logoutAdmin()">
        Se déconnecter
    </button>

</div>


<script>

/* =========================================
   UTILITAIRES
========================================= */

function formatFCFA(amount) {

    return (
        Number(amount) || 0
    ).toLocaleString("fr-FR")
    + " FCFA";
}


function getTransactions() {

    try {

        const data =
            localStorage.getItem(
                "housingTransactions"
            );

        if (!data) {
            return [];
        }

        const transactions =
            JSON.parse(data);

        return Array.isArray(transactions)
            ? transactions
            : [];

    } catch (error) {

        console.error(error);

        return [];
    }
}


function saveTransactions(transactions) {

    localStorage.setItem(
        "housingTransactions",
        JSON.stringify(transactions)
    );
}


/* =========================================
   MENU
========================================= */

function showSection(
    sectionId,
    button
) {

    const sections =
        document.querySelectorAll(
            ".section"
        );

    sections.forEach(
        function(section) {

            section.style.display =
                "none";

        }
    );

    document.getElementById(
        sectionId
    ).style.display = "block";


    const buttons =
        document.querySelectorAll(
            ".menu button"
        );

    buttons.forEach(
        function(btn) {

            btn.classList.remove(
                "active"
            );

        }
    );

    button.classList.add(
        "active"
    );
}


/* =========================================
   UTILISATEURS
========================================= */

function getUsers() {

    const possibleKeys = [
        "housingUsers",
        "users",
        "registeredUsers"
    ];

    for (
        let i = 0;
        i < possibleKeys.length;
        i++
    ) {

        const data =
            localStorage.getItem(
                possibleKeys[i]
            );

        if (!data) {
            continue;
        }

        try {

            const users =
                JSON.parse(data);

            if (Array.isArray(users)) {
                return users;
            }

        } catch (error) {

            console.error(error);

        }
    }

    return [];
}


function displayUsers() {

    const container =
        document.getElementById(
            "usersList"
        );

    const users =
        getUsers();

    if (users.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucun utilisateur enregistré.</div>';

        return;
    }

    container.innerHTML = "";

    users.forEach(
        function(user, index) {

            const name =
                user.name ||
                user.fullName ||
                user.nom ||
                "Utilisateur";

            const phone =
                user.phone ||
                user.telephone ||
                "Non renseigné";

            const div =
                document.createElement(
                    "div"
                );

            div.className = "user";

            div.innerHTML = `
                <strong>${name}</strong>
                <br>
                Téléphone : ${phone}
            `;

            container.appendChild(
                div
            );
        }
    );
}


/* =========================================
   TEXTE
========================================= */

function typeText(type) {

    if (type === "deposit") {
        return "Dépôt";
    }

    if (type === "withdrawal") {
        return "Retrait";
    }

    return "Opération";
}


function statusText(status) {

    if (status === "approved") {
        return "Validé";
    }

    if (status === "rejected") {
        return "Refusé";
    }

    return "En attente";
}


function statusClass(status) {

    if (status === "approved") {
        return "approved";
    }

    if (status === "rejected") {
        return "rejected";
    }

    return "pending";
}


/* =========================================
   AFFICHAGE OPERATION
========================================= */

function operationHTML(
    transaction
) {

    const date =
        new Date(
            transaction.date
        ).toLocaleString(
            "fr-FR"
        );

    let buttons = "";

    if (
        transaction.status ===
        "pending"
    ) {

        buttons = `

            <div class="buttons">

                <button
                    class="approve"
                    onclick="updateTransaction(
                        '${transaction.id}',
                        'approved'
                    )">
                    Valider
                </button>

                <button
                    class="reject"
                    onclick="updateTransaction(
                        '${transaction.id}',
                        'rejected'
                    )">
                    Refuser
                </button>

            </div>

        `;
    }

    return `

        <div class="operation">

            <div class="operation-header">

                <div>

                    <strong>
                        ${transaction.userName || "Utilisateur"}
                    </strong>

                    <br>

                    Téléphone :
                    ${transaction.phone || "Non renseigné"}

                </div>

                <span
                    class="status ${statusClass(
                        transaction.status
                    )}">
                    ${statusText(
                        transaction.status
                    )}
                </span>

            </div>

            <p>
                Type :
                <strong>
                    ${typeText(
                        transaction.type
                    )}
                </strong>
            </p>

            <p class="amount">
                ${formatFCFA(
                    transaction.amount
                )}
            </p>

            <small>
                Date : ${date}
            </small>

            ${buttons}

        </div>
    `;
}


/* =========================================
   DEPOTS
========================================= */

function displayDeposits() {

    const container =
        document.getElementById(
            "depositsList"
        );

    const transactions =
        getTransactions()
        .filter(
            function(transaction) {

                return (
                    transaction.type ===
                    "deposit"
                );

            }
        )
        .sort(
            function(a, b) {

                return (
                    new Date(b.date) -
                    new Date(a.date)
                );

            }
        );

    if (transactions.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucune demande de dépôt.</div>';

        return;
    }

    container.innerHTML =
        transactions
        .map(operationHTML)
        .join("");
}


/* =========================================
   RETRAITS
========================================= */

function displayWithdrawals() {

    const container =
        document.getElementById(
            "withdrawalsList"
        );

    const transactions =
        getTransactions()
        .filter(
            function(transaction) {

                return (
                    transaction.type ===
                    "withdrawal"
                );

            }
        )
        .sort(
            function(a, b) {

                return (
                    new Date(b.date) -
                    new Date(a.date)
                );

            }
        );

    if (transactions.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucune demande de retrait.</div>';

        return;
    }

    container.innerHTML =
        transactions
        .map(operationHTML)
        .join("");
}


/* =========================================
   HISTORIQUE
========================================= */

function displayHistory() {

    const container =
        document.getElementById(
            "historyList"
        );

    const transactions =
        getTransactions()
        .sort(
            function(a, b) {

                return (
                    new Date(b.date) -
                    new Date(a.date)
                );

            }
        );

    if (transactions.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucune opération enregistrée.</div>';

        return;
    }

    container.innerHTML =
        transactions
        .map(operationHTML)
        .join("");
}


/* =========================================
   VALIDATION / REFUS
========================================= */

function updateTransaction(
    transactionId,
    newStatus
) {

    const transactions =
        getTransactions();

    const transaction =
        transactions.find(
            function(item) {

                return (
                    item.id ===
                    transactionId
                );

            }
        );

    if (!transaction) {

        alert(
            "Opération introuvable."
        );

        return;
    }


    if (
        transaction.status !==
        "pending"
    ) {

        alert(
            "Cette opération a déjà été traitée."
        );

        return;
    }


    transaction.status =
        newStatus;


    saveTransactions(
        transactions
    );


    alert(
        newStatus === "approved"
            ? "Opération validée."
            : "Opération refusée."
    );


    refreshAdmin();
}


/* =========================================
   ACTUALISATION
========================================= */

function refreshAdmin() {

    displayUsers();

    displayDeposits();

    displayWithdrawals();

    displayHistory();
}


/* =========================================
   DECONNEXION ADMIN
========================================= */

function logoutAdmin() {

    window.location.href =
        "index.html";
}


/* =========================================
   INITIALISATION
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        refreshAdmin();

    }
);

</script>

</body>
</html>
